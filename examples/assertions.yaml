version: 1
assertions:
  - type: assert_no_undefined_references
    description: Every referenced ACL, route-map, etc. is defined.
  - type: assert_no_forwarding_loops
  - type: assert_no_unestablished_bgp_sessions
    name: BGP sessions are up
  - type: assert_no_incompatible_ospf_sessions
  - type: assert_zero_results
    name: No unused structures
    question:
      fun: unusedStructures
  - type: assert_num_results
    description: Exactly two BGP edges expected.
    question:
      fun: bgpEdges
    params:
      num: 2
  # The next three use device names from the abc_net example; adjust for your network.
  - type: assert_flows_succeed
    description: Web traffic from border1 reaches the server.
    params:
      startLocation: as1border1
      headers:
        dstIps: 10.0.0.1
        applications: [HTTP]
  - type: assert_filter_permits
    params:
      filters: acl_in
      headers:
        srcIps: 1.1.1.1
  - type: assert_has_route
    params:
      node: as1border1
      expected_route:
        Network: 10.0.0.0/24
        Protocol: bgp
