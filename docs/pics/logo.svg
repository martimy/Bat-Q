<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="200" height="200" rx="32" fill="#FFFFFFF"/>

  <!-- Network Topology Edges -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Outer Left Wing Arc -->
    <line x1="100" y1="65" x2="65" y2="45" />
    <line x1="65" y1="45" x2="25" y2="60" />
    <line x1="25" y1="60" x2="50" y2="105" />
    <line x1="50" y1="105" x2="75" y2="125" />

    <!-- Outer Right Wing Arc -->
    <line x1="100" y1="65" x2="135" y2="45" />
    <line x1="135" y1="45" x2="175" y2="60" />
    <line x1="175" y1="60" x2="150" y2="105" />
    <line x1="150" y1="105" x2="125" y2="125" />


    <!-- Wing Support Ribs -->
    <line x1="65" y1="45" x2="75" y2="85" />
    <line x1="135" y1="45" x2="125" y2="85" />
  </g>

  <!-- Highlighted "Q" Tail (Streamlit Red) -->
  <g stroke="#FF4B4B" stroke-width="3.5" stroke-linecap="round">
    <!-- Inner Central "Q" Ring Topology -->
    <line x1="100" y1="65" x2="75" y2="85" />
    <line x1="75" y1="85" x2="75" y2="125" />
    <line x1="75" y1="125" x2="100" y2="145" />
    <line x1="100" y1="145" x2="125" y2="125" />
    <line x1="125" y1="125" x2="125" y2="85" />
    <line x1="125" y1="85" x2="100" y2="65" />

    <line x1="115" y1="115" x2="148" y2="152" />
  </g>

  <!-- Network Nodes -->
  <g fill="#06B6D4" stroke="#F8FAFC" stroke-width="1.5">
    
    <!-- Left Wing Nodes -->
    <circle cx="65" cy="45" r="4" />
    <circle cx="25" cy="60" r="4.5" />
    <circle cx="50" cy="105" r="4" />
    
    <!-- Right Wing Nodes -->
    <circle cx="135" cy="45" r="4" />
    <circle cx="175" cy="60" r="4.5" />
    <circle cx="150" cy="105" r="4" />
    

  </g>

  <!-- Terminal "Q" Tail Accent Node -->
  <circle cx="148" cy="152" r="5.5" fill="#FF4B4B" stroke="#F8FAFC" stroke-width="1.5" />

  <g fill="#FF4B4B" stroke="#F8FAFC" stroke-width="1.5">
    <!-- Head / Top Node -->
    <circle cx="100" cy="65" r="5" fill="#FF4B4B"/>

    <circle cx="75" cy="85" r="4.5" />
    <circle cx="75" cy="125" r="4.5" />

    <circle cx="125" cy="85" r="4.5" />
    <circle cx="125" cy="125" r="4.5" />

    <!-- Bottom Body Node -->
    <circle cx="100" cy="145" r="4.5" />
  </g>

  <!-- Wordmark -->
  <text x="225" y="145" font-family="Arial, Helvetica, sans-serif" font-size="148" font-weight="bold" fill="#0F172A">Bat-Q</text>

</svg>
